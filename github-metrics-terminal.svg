<svg xmlns="http://www.w3.org/2000/svg" width="880" height="725" viewBox="0 0 880 725" fill="none">
  <defs>
    <style>
      .window {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 11.5px;
        line-height: 16px;
        color: #c9d1d9;
      }
      .titlebar {
        fill: #161b22;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1;
      }
      .body {
        fill: #0d1117;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1;
      }
      .path { fill: #58a6ff; font-weight: 500; }
      .branch { fill: #3fb950; }
      .prompt { fill: #3fb950; font-weight: bold; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .h2 { fill: #79c0ff; font-weight: bold; }
      .bullet { fill: #3fb950; }
      .bold { fill: #f0f6fc; font-weight: 600; }
      .highlight { fill: #e5c07b; }
      .dim { fill: #8b949e; }
      .lang-name { fill: #f0f6fc; font-weight: 600; }
      .bar-bg { fill: #21262d; }
      .pct { fill: #79c0ff; font-weight: 500; font-size: 11px; }
      .logo {
        font-family: "Apple Symbols", "DejaVu Sans", "Segoe UI Symbol", monospace;
        font-size: 11px;
        fill: #e6edf3;
        letter-spacing: -0.5px;
      }
      .val { fill: #e6edf3; }
      .cursor-idle { fill: #484f58; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor-active { animation: blink 1s infinite; fill: #58a6ff; font-weight: bold; }
    </style>
  </defs>

  <!-- ========================================== -->
  <!-- 1. TOP WINDOW: fastfetch (880x350)         -->
  <!-- ========================================== -->
