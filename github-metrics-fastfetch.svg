<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" fill="none">
  <defs>
    <style>
      .window {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 11.5px;
        line-height: 16px;
        color: #c9d1d9;
      }
      .titlebar {
        fill: #161b22;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1;
      }
      .body {
        fill: #0d1117;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1;
      }
      .path { fill: #58a6ff; font-weight: 500; }
      .branch { fill: #3fb950; }
      .prompt { fill: #3fb950; font-weight: bold; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .dim { fill: #8b949e; }
      .logo {
        font-family: "Apple Symbols", "DejaVu Sans", "Segoe UI Symbol", monospace;
        font-size: 11px;
        fill: #e6edf3;
        letter-spacing: -0.5px;
      }
      .val { fill: #e6edf3; }
      .cursor-idle { fill: #484f58; }
    </style>
  </defs>

  <!-- Window Container -->
  <g class="window">
    <!-- Window Body -->
    <rect x="0.5" y="0.5" width="879" height="349" rx="10" class="body" />
    
    <!-- Titlebar (Empty) -->
    <path d="M 0.5 10.5 C 0.5 4.977 4.977 0.5 10.5 0.5 L 869.5 0.5 C 875.023 0.5 879.5 4.977 879.5 10.5 L 879.5 30.5 L 0.5 30.5 Z" class="titlebar" />

    <!-- macOS Traffic Light Buttons -->
    <circle cx="16" cy="15.5" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="34" cy="15.5" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="52" cy="15.5" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Terminal Prompt: fastfetch -->
    <text x="20" y="52">
      <tspan class="path">~/Tiitmouse</tspan>
      <tspan class="dim"> on </tspan>
      <tspan class="branch">main</tspan>
    </text>
    <text x="20" y="68">
      <tspan class="prompt">&gt; </tspan>
      <tspan class="cmd">fastfetch</tspan>
    </text>

    <!-- Logo on Left -->
    <text x="45" y="104" class="logo">⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢠⢰⢲⢺⢶⣤⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀</text>
    <text x="45" y="120" class="logo">⠀⠀⠀⠀⣄⢄⣀⠀⠀⠀⠠⡱⡑⢕⠱⢱⠱⡱⡁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀</text>
    <text x="45" y="136" class="logo">⠀⠀⢠⢣⢣⢣⢣⢣⠢⡀⢐⢌⠢⠡⡑⡡⢊⠢⡣⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀</text>
    <text x="45" y="152" class="logo">⠀⠠⢣⠱⡨⠢⢱⠨⡊⢌⠢⡂⢿⡕⡐⢌⠢⡱⠁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀</text>
    <text x="45" y="168" class="logo">⠀⠀⠡⡑⢌⠪⡐⡡⢊⠢⡑⡌⡌⣯⡆⡕⠌⠀⠀⠀⠀⠀⢀⠀⡀⢀⠀⠀⠀⠀</text>
    <text x="45" y="184" class="logo">⠀⠀⠀⠈⠐⠡⢂⠪⡐⡑⠌⠆⢫⣗⡯⡎⡆⢖⢌⠢⡡⢃⠇⡕⢜⠔⡑⢕⠀⠀</text>
    <text x="45" y="200" class="logo">⠀⠀⠀⠀⠀⠀⠀⠀⠀⡀⢄⢎⢾⠆⡯⡪⡝⣆⠥⡑⢌⠔⡨⢐⠡⡨⠨⢢⢑⠀</text>
    <text x="45" y="216" class="logo">⠀⢀⢠⢐⢔⢔⢕⢕⢕⢱⢱⢱⠝⠀⢫⡪⡪⡢⢫⢪⠢⢊⢔⢡⡊⡦⠹⠜⠊⠀</text>
    <text x="45" y="232" class="logo">⠀⠸⡌⢎⠆⡇⢇⢇⢇⢇⢇⠃⠀⠀⢐⢕⠜⢌⢊⠢⢣⠠⠀⠀⠀⠀⠀⠀⠀⠀</text>
    <text x="45" y="248" class="logo">⠀⠀⠸⣘⠬⡪⡪⡒⡕⡜⠌⠀⠀⠀⠐⢅⠪⡊⡢⢑⠅⢕⠱⡠⠀⠀⠀⠀⠀⠀</text>
    <text x="45" y="264" class="logo">⠀⠀⠀⠀⠙⠸⠘⠘⠈⠀⠀⠀⠀⠀⠀⢊⠢⡊⢔⠡⡊⢔⠡⡊⡂⠀⠀⠀⠀⠀</text>
    <text x="45" y="280" class="logo">⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠨⠢⡑⢌⢢⠑⠈⠀⠀⠀⠀⠀⠀⠀</text>

    <!-- Vector Fastfetch Key Box (Never breaks!) -->
    <rect x="300" y="88" width="108" height="218" rx="5" stroke="#d29922" stroke-width="1.2" fill="none" />
    <line x1="300" y1="278" x2="408" y2="278" stroke="#d29922" stroke-width="1.2" />

    <!-- Keys & Values -->
    <text x="314" y="104" fill="#e06c75" font-weight="600">user</text>
    <text x="422" y="104" class="val">Tiitmouse</text>
    <text x="314" y="120" fill="#98c379" font-weight="600">os</text>
    <text x="422" y="120" class="val">macOS (arm64)</text>
    <text x="314" y="136" fill="#61afef" font-weight="600">uptime</text>
    <text x="422" y="136" class="val">registered 5 years ago</text>
    <text x="314" y="152" fill="#e5c07b" font-weight="600">repos</text>
    <text x="422" y="152" class="val">24 public repositories</text>
    <text x="314" y="168" fill="#c678dd" font-weight="600">commits</text>
    <text x="422" y="168" class="val">883 commits</text>
    <text x="314" y="184" fill="#56b6c2" font-weight="600">prs</text>
    <text x="422" y="184" class="val">1 opened</text>
    <text x="314" y="200" fill="#98c379" font-weight="600">contrib</text>
    <text x="422" y="200" class="val">6 repositories</text>
    <text x="314" y="216" fill="#e5c07b" font-weight="600">stars</text>
    <text x="422" y="216" class="val">4 stargazers</text>
    <text x="314" y="232" fill="#61afef" font-weight="600">watchers</text>
    <text x="422" y="232" class="val">15 watching</text>
    <text x="314" y="248" fill="#c678dd" font-weight="600">disk</text>
    <text x="422" y="248" class="val">387 MB used</text>
    <text x="314" y="264" fill="#56b6c2" font-weight="600">shell</text>
    <text x="422" y="264" class="val">zsh 5.9 (ghostty)</text>
    <text x="314" y="294" fill="#abb2bf" font-weight="600">colors</text>
    <text x="422" y="294"><tspan fill="#e06c75">● </tspan><tspan fill="#98c379">● </tspan><tspan fill="#e5c07b">● </tspan><tspan fill="#61afef">● </tspan><tspan fill="#c678dd">● </tspan><tspan fill="#56b6c2">● </tspan><tspan fill="#abb2bf">● </tspan><tspan fill="#ffffff">●</tspan></text>

    <!-- Bottom cursor prompt -->
    <text x="20" y="332">
      <tspan class="path">~/Tiitmouse</tspan>
      <tspan class="dim"> on </tspan>
      <tspan class="branch">main</tspan>
      <tspan class="prompt"> &gt; </tspan>
      <tspan class="cursor-idle">█</tspan>
    </text>
  </g>
