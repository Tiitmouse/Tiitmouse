<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360" fill="none">
  <defs>
    <style>
      .window {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 11.5px;
        line-height: 16px;
        color: #c9d1d9;
      }
      .titlebar {
        fill: #161b22;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1;
      }
      .body {
        fill: #0d1117;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1;
      }
      .path { fill: #58a6ff; font-weight: 500; }
      .branch { fill: #3fb950; }
      .prompt { fill: #3fb950; font-weight: bold; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .lang-name { fill: #f0f6fc; font-weight: 600; }
      .bar-bg { fill: #21262d; }
      .pct { fill: #79c0ff; font-weight: 500; font-size: 11px; }
      .dim { fill: #8b949e; }
      .cursor-idle { fill: #484f58; }
    </style>
  </defs>

  <g class="window">
    <rect x="0.5" y="0.5" width="299" height="359" rx="10" class="body" />
    <path d="M 0.5 10.5 C 0.5 4.977 4.977 0.5 10.5 0.5 L 289.5 0.5 C 295.023 0.5 299.5 4.977 299.5 10.5 L 299.5 30.5 L 0.5 30.5 Z" class="titlebar" />

    <circle cx="16" cy="15.5" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="34" cy="15.5" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="52" cy="15.5" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <text x="20" y="52">
      <tspan class="path">~/Tiitmouse</tspan>
      <tspan class="dim"> on </tspan>
      <tspan class="branch">main</tspan>
    </text>
    <text x="20" y="68">
      <tspan class="prompt">&gt; </tspan>
      <tspan class="cmd">locale --languages</tspan>
    </text>
    <text x="20" y="90" class="dim">Most used languages:</text>

    <!-- Language Bars (Total bar width: 145) -->
    <text x="20" y="114" class="lang-name">QML</text>
    <rect x="75" y="105" width="145" height="9" rx="3" class="bar-bg" />
    <rect x="75" y="105" width="63" height="9" rx="3" fill="#44a51c" />
    <text x="230" y="114" class="pct">43.12%</text>

    <text x="20" y="138" class="lang-name">C</text>
    <rect x="75" y="129" width="145" height="9" rx="3" class="bar-bg" />
    <rect x="75" y="129" width="48" height="9" rx="3" fill="#555555" />
    <text x="230" y="138" class="pct">33.08%</text>

    <text x="20" y="162" class="lang-name">C#</text>
    <rect x="75" y="153" width="145" height="9" rx="3" class="bar-bg" />
    <rect x="75" y="153" width="10" height="9" rx="3" fill="#178600" />
    <text x="230" y="162" class="pct">4.86%</text>

    <text x="20" y="186" class="lang-name">Shell</text>
    <rect x="75" y="177" width="145" height="9" rx="3" class="bar-bg" />
    <rect x="75" y="177" width="9" height="9" rx="3" fill="#89e051" />
    <text x="230" y="186" class="pct">4.45%</text>

    <text x="20" y="210" class="lang-name">Go</text>
    <rect x="75" y="201" width="145" height="9" rx="3" class="bar-bg" />
    <rect x="75" y="201" width="8" height="9" rx="3" fill="#00ADD8" />
    <text x="230" y="210" class="pct">4.12%</text>

    <text x="20" y="234" class="lang-name">Java</text>
    <rect x="75" y="225" width="145" height="9" rx="3" class="bar-bg" />
    <rect x="75" y="225" width="8" height="9" rx="3" fill="#b07219" />
    <text x="230" y="234" class="pct">3.80%</text>

    <text x="20" y="258" class="lang-name">JS</text>
    <rect x="75" y="249" width="145" height="9" rx="3" class="bar-bg" />
    <rect x="75" y="249" width="8" height="9" rx="3" fill="#f1e05a" />
    <text x="230" y="258" class="pct">3.79%</text>

    <text x="20" y="282" class="lang-name">HTML</text>
    <rect x="75" y="273" width="145" height="9" rx="3" class="bar-bg" />
    <rect x="75" y="273" width="6" height="9" rx="3" fill="#e34c26" />
    <text x="230" y="282" class="pct">2.79%</text>

    <text x="20" y="308" class="dim">Total: 8 languages (387 MB)</text>

    <text x="20" y="336">
      <tspan class="path">~/Tiitmouse</tspan>
      <tspan class="dim"> on </tspan>
      <tspan class="branch">main</tspan>
      <tspan class="prompt"> &gt; </tspan>
      <tspan class="cursor-idle">█</tspan>
    </text>
  </g>
</svg>