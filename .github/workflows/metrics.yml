name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Terminal - Profile & Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Tiitmouse
          filename: github-metrics-activity.svg
          template: terminal
          base: header, activity, repositories
          extras_css: |
            pre {
              background: #0d1117 !important;
              border: 1px solid rgba(255, 255, 255, 0.12) !important;
              border-top: none !important;
              border-radius: 0 0 10px 10px !important;
              color: #c9d1d9 !important;
            }
            .header {
              display: flex !important;
              flex-direction: row-reverse !important;
              justify-content: flex-end !important;
              gap: 8px !important;
              background: #161b22 !important;
              border: 1px solid rgba(255, 255, 255, 0.12) !important;
              border-bottom: none !important;
              border-radius: 10px 10px 0 0 !important;
              height: 30px !important;
              padding: 0 12px !important;
            }
            .buttons {
              display: flex !important;
              flex-direction: row-reverse !important;
              gap: 6px !important;
            }
            .button {
              font-size: 0px !important;
              width: 11px !important;
              height: 11px !important;
              border-radius: 50% !important;
              margin: 0 !important;
              background: #27c93f !important;
            }
            .button:nth-child(2) { background: #ffbd2e !important; }
            .button.exit { background: #ff5f56 !important; }
            .header::after {
              content: 'lorena@ghostty: ~/Documents/Projects/Tiitmouse';
              font-family: monospace;
              font-size: 11px;
              color: #8b949e;
              margin-left: 8px;
            }
            .ps1-path { color: #58a6ff !important; }
            .ps1-location { color: #3fb950 !important; }

      - name: Terminal - Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Tiitmouse
          filename: github-metrics-languages.svg
          template: terminal
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          extras_css: |
            pre {
              background: #0d1117 !important;
              border: 1px solid rgba(255, 255, 255, 0.12) !important;
              border-top: none !important;
              border-radius: 0 0 10px 10px !important;
              color: #c9d1d9 !important;
            }
            .header {
              display: flex !important;
              flex-direction: row-reverse !important;
              justify-content: flex-end !important;
              gap: 8px !important;
              background: #161b22 !important;
              border: 1px solid rgba(255, 255, 255, 0.12) !important;
              border-bottom: none !important;
              border-radius: 10px 10px 0 0 !important;
              height: 30px !important;
              padding: 0 12px !important;
            }
            .buttons {
              display: flex !important;
              flex-direction: row-reverse !important;
              gap: 6px !important;
            }
            .button {
              font-size: 0px !important;
              width: 11px !important;
              height: 11px !important;
              border-radius: 50% !important;
              margin: 0 !important;
              background: #27c93f !important;
            }
            .button:nth-child(2) { background: #ffbd2e !important; }
            .button.exit { background: #ff5f56 !important; }
            .header::after {
              content: 'lorena@ghostty: ~/Documents/Projects/Tiitmouse/languages';
              font-family: monospace;
              font-size: 11px;
              color: #8b949e;
              margin-left: 8px;
            }
            .ps1-path { color: #58a6ff !important; }
            .ps1-location { color: #3fb950 !important; }
