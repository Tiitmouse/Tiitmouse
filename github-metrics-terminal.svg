    <text x="20" y="294">
      <tspan class="bullet">▸ </tspan>
      <tspan class="dim">Student job, internship or junior role in software development</tspan>
    </text>

    <!-- Bottom cursor prompt (ACTIVE BLINKING UNDERSCORE) -->
