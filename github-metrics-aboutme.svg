<svg xmlns="http://www.w3.org/2000/svg" width="570" height="360" viewBox="0 0 570 360" fill="none">
  <defs>
    <style>
      .window {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 11.5px;
        line-height: 16px;
        color: #c9d1d9;
      }
      .titlebar {
        fill: #161b22;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1;
      }
      .body {
        fill: #0d1117;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1;
      }
      .path { fill: #58a6ff; font-weight: 500; }
      .branch { fill: #3fb950; }
      .prompt { fill: #3fb950; font-weight: bold; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .h2 { fill: #79c0ff; font-weight: bold; }
      .bullet { fill: #3fb950; }
      .bold { fill: #f0f6fc; font-weight: 600; }
      .highlight { fill: #e5c07b; }
      .dim { fill: #8b949e; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; fill: #58a6ff; font-weight: bold; }
    </style>
  </defs>

  <g class="window">
    <rect x="0.5" y="0.5" width="569" height="359" rx="10" class="body" />
    <path d="M 0.5 10.5 C 0.5 4.977 4.977 0.5 10.5 0.5 L 559.5 0.5 C 565.023 0.5 569.5 4.977 569.5 10.5 L 569.5 30.5 L 0.5 30.5 Z" class="titlebar" />

    <circle cx="16" cy="15.5" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="34" cy="15.5" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="52" cy="15.5" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Terminal Prompt: cat aboutme.md -->
    <text x="20" y="52">
      <tspan class="path">~/Tiitmouse</tspan>
      <tspan class="dim"> on </tspan>
      <tspan class="branch">main</tspan>
    </text>
    <text x="20" y="68">
      <tspan class="prompt">&gt; </tspan>
      <tspan class="cmd">cat aboutme.md</tspan>
    </text>

    <!-- Education Section -->
    <text x="20" y="96" class="h2">## Education &amp; Background</text>
    <text x="20" y="116">
      <tspan class="bullet">▸ </tspan>
      <tspan class="bold">M.Sc. Software Engineering</tspan>
      <tspan class="dim"> (in progress) @ </tspan>
      <tspan class="highlight">UiB &amp; HVL</tspan>
      <tspan class="dim"> (Bergen, Norway)</tspan>
    </text>
    <text x="20" y="136">
      <tspan class="bullet">▸ </tspan>
      <tspan class="bold">B.Sc. Computer Engineering</tspan>
      <tspan class="dim"> @ </tspan>
      <tspan class="highlight">Algebra University</tspan>
      <tspan class="dim"> (Zagreb, Croatia)</tspan>
    </text>

    <!-- Tech Stack & Interests -->
    <text x="20" y="164" class="h2">## Tech Stack &amp; Interests</text>
    <text x="20" y="184">
      <tspan class="bullet">▸ </tspan>
      <tspan class="bold">Systems &amp; Backend: </tspan>
      <tspan class="dim">C, C++, Go, C#</tspan>
    </text>
    <text x="20" y="204">
      <tspan class="bullet">▸ </tspan>
      <tspan class="bold">Web Development: </tspan>
      <tspan class="dim">Vue.js, TypeScript, JavaScript, PHP, Wails</tspan>
    </text>
    <text x="20" y="224">
      <tspan class="bullet">▸ </tspan>
      <tspan class="bold">Interests: </tspan>
      <tspan class="dim">Systems programming, real-time &amp; hardware integration</tspan>
    </text>
    <text x="20" y="244">
      <tspan class="bullet">▸ </tspan>
      <tspan class="bold">Environments: </tspan>
      <tspan class="dim">macOS (Ghostty + zsh) • Manjaro (Hyprland)</tspan>
    </text>

    <!-- Looking For -->
    <text x="20" y="274" class="h2">## Looking For</text>
    <text x="20" y="294">
      <tspan class="bullet">▸ </tspan>
      <tspan class="dim">Student job, internship or junior role in software development</tspan>
    </text>

    <!-- Bottom cursor prompt -->
    <text x="20" y="336">
      <tspan class="path">~/Tiitmouse</tspan>
      <tspan class="dim"> on </tspan>
      <tspan class="branch">main</tspan>
      <tspan class="prompt"> &gt; </tspan>
      <tspan class="cursor">_</tspan>
    </text>
  </g>
</svg>